<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Audio transcription</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#f7f9fc; margin:0; padding:40px; color:#1f2937; }
  .box { max-width: 560px; margin: 0 auto; background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:28px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color:#6b7280; font-size: 14px; }
  input[type=file] { display:block; margin: 18px 0; }
  textarea { width:100%; min-height:120px; padding:12px; border:1px solid #d1d5db; border-radius:10px; font-size:14px; }
  .row { display:flex; gap:10px; align-items:center; }
  button { background:#0d9488; color:#fff; border:0; border-radius:10px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  #status { margin-top:12px; font-size:13px; color:#6b7280; }
</style>
</head>
<body>
  <div class="box">
    <h1>Audio transcription</h1>
    <p>Upload a recording to get the spoken text back.</p>
    <input type="file" id="file" accept="audio/*,video/*" />
    <div class="row">
      <button id="go" onclick="go()">Transcribe</button>
      <span id="status">Waiting for a file...</span>
    </div>
    <textarea id="out" placeholder="The transcript will appear here" readonly></textarea>
  </div>
<script>
  function go() {
    const f = document.getElementById('file').files[0];
    if (!f) { document.getElementById('status').textContent = 'Choose a file first.'; return; }
    document.getElementById('status').textContent = 'Uploading and transcribing...';
    const fd = new FormData();
    fd.append('audio', f);
    fetch('/api/stt', { method: 'POST', body: fd })
      .then(r => r.json())
      .then(j => {
        document.getElementById('out').value = j.transcript || j.error || '';
        document.getElementById('status').textContent = 'Done.';
      })
      .catch(e => {
        document.getElementById('status').textContent = 'Failed: ' + e;
        document.getElementById('out').value = '';
      });
  }

  // A file input cannot be typed into, so when the page is opened with
  // ?src=<url> we pull the recording ourselves and put it in the input.
  // That way a web agent only has to open the page and read the result.
  (function autoLoad() {
    const src = new URLSearchParams(location.search).get('src');
    if (!src) return;
    document.getElementById('status').textContent = 'Fetching the recording...';
    fetch(src)
      .then(r => r.blob())
      .then(blob => {
        const file = new File([blob], 'recording.webm', { type: blob.type || 'audio/webm' });
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('file').files = dt.files;
        document.getElementById('status').textContent = 'Transcribing...';
        go();
      })
      .catch(e => {
        document.getElementById('out').value = 'Could not fetch the recording: ' + e;
        document.getElementById('status').textContent = 'Failed.';
      });
  })();
</script>
</body>
</html>
